<header id="top">
  <button class="btn ghost icon mobileOnly" id="btnLeft" title="Libreria"><svg class="i"><use href="#i-menu"/></svg></button>
  <div class="logo" id="btnHome" title="I tuoi progetti"><svg class="i"><use href="#i-cube"/></svg><span>Smonta Studio</span></div>
  <div id="projTitle" title="Rinomina il progetto"><b id="projName">—</b><span id="projInfo"></span></div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="design"><svg class="i"><use href="#i-cube"/></svg><span>Progetta</span></button>
    <button class="tab" data-tab="sheet"><svg class="i"><use href="#i-drawing"/></svg><span>Tavola 2D</span></button>
    <button class="tab" data-tab="bom"><svg class="i"><use href="#i-list"/></svg><span>Distinta</span></button>
    <button class="tab" data-tab="assy"><svg class="i"><use href="#i-play"/></svg><span>Montaggio</span></button>
  </nav>
  <div class="topActions">
    <button class="btn ghost icon" id="btnUndo" title="Annulla (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="btn ghost icon" id="btnRedo" title="Ripeti (Ctrl+Y)"><svg class="i"><use href="#i-redo"/></svg></button>
    <button class="btn desktopOnly" id="btnExport"><svg class="i"><use href="#i-export"/></svg>Esporta</button>
    <button class="btn primary desktopOnly" id="btnSave"><svg class="i"><use href="#i-save"/></svg>Salva</button>
    <button class="btn ghost icon mobileOnly" id="btnExportM" title="Esporta"><svg class="i"><use href="#i-export"/></svg></button>
    <button class="btn ghost icon mobileOnly" id="btnRight" title="Proprietà"><svg class="i"><use href="#i-sliders"/></svg></button>
  </div>
</header>
<div id="main">
  <aside id="left" class="panel"></aside>
  <section id="center">
    <div id="view"></div>
    <div class="chips" id="chips"></div>
    <div class="cube" id="btnFit" title="Inquadra tutto"><svg class="i"><use href="#i-cube"/></svg>Adatta</div>
    <div id="tip" class="off"><svg class="i"><use href="#i-bolted"/></svg><span></span></div>
    <div id="toolbar"></div>
    <div id="sheetView" class="pageView hidden"></div>
    <div id="bomView" class="pageView hidden"></div>
    <div id="assy" class="hidden"></div>
  </section>
  <aside id="right" class="panel"></aside>
</div>
<div id="scrim" class="hidden"></div>
<footer id="status">
  <span>Unità: mm</span>
  <span>Aggancio: <select id="snapSel"><option value="0">libero</option><option value="1">1 mm</option><option value="5">5 mm</option><option value="10">10 mm</option></select></span>
  <span class="desktopOnly">Griglia: <select id="gridSel"><option value="10">10 mm</option><option value="20">20 mm</option><option value="50">50 mm</option><option value="100">100 mm</option></select></span>
  <span class="desktopOnly" id="stParts"></span>
  <span id="stMass"></span>
  <span id="checksBtn" class="ok"><svg class="i"><use href="#i-check"/></svg><span>Controlli</span></span>
</footer>
<div id="home" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toasts"></div>
<div id="printArea" class="hidden"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
