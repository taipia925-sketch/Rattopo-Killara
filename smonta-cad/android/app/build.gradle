plugins { id 'com.android.application' }

android {
    namespace 'it.smontastudio.cad'
    compileSdk 35
    defaultConfig {
        applicationId 'it.smontastudio.cad'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // copia l'app web dentro l'APK
    sourceSets { main { assets.srcDirs = ['src/main/assets', '../../www-build'] } }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
